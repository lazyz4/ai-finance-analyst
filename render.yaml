# Render 部署配置（免费 Web Service）
# 用法：Render 控制台 → New → Blueprint → 选中本仓库，会自动读取这份配置
services:
  - type: web
    name: ai-finance-analyst
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # 让日文/中文文件名与日志正常输出，避免容器内编码问题
      - key: PYTHONIOENCODING
        value: utf-8
